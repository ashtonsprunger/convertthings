<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .ct-fav-light { display: block; }
    .ct-fav-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .ct-fav-light { display: none; }
      .ct-fav-dark { display: block; }
    }
  </style>
  <image class="ct-fav-light" href="data:image/png;base64," width="64" height="64" preserveAspectRatio="xMidYMid meet" />
  <image class="ct-fav-dark" href="data:image/png;base64," width="64" height="64" preserveAspectRatio="xMidYMid meet" />
</svg>
